[project]
name = "picfinder"
version = "0.3.0"
description = "AllDownload: download photos and videos from shared links and galleries (Python plugins, also reads .etmpl templates)"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["httpx[socks,http2]>=0.27", "PySide6>=6.8,<6.13"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
picfinder = "picfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picfinder*"]

[tool.setuptools.package-data]
picfinder = ["templates/*.etmpl", "templates/*.md"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
